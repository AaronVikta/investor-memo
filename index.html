<style>
  :root { --ink: #0d1b2a; --ivory: #f6f3ec; --paper: #fffefb; --emerald: #1c6e5a; --emerald-bright: #2a9d78; --slate: #5a6672; --line: #d9d3c6; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    background: var(--ink); color: var(--ivory); font-family: 'Inter', system-ui, sans-serif; padding: 2rem;

  a.doc-link {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: 1rem 1.3rem; border: 1px solid rgba(246,243,236,0.18); border-radius: 10px;
    color: var(--ivory); text-decoration: none; font-size: 15px; font-weight: 500;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  a.doc-link:hover { border-color: var(--emerald-bright); background: rgba(42,157,120,0.08); }
  a.doc-link span.arrow { color: var(--emerald-bright); }
  a.doc-link small { display: block; font-weight: 400; color: rgba(246,243,236,0.55); margin-top: 0.2rem; }
